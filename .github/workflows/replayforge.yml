name: ReplayForge Demo

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "replayforge.config.json"
      - "src/**"
      - "bin/**"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node ./bin/replayforge.mjs generate
